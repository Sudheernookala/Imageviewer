<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%235b9dff%22/%3E%3Ccircle cx=%225.5%22 cy=%225.5%22 r=%221.8%22 fill=%22white%22/%3E%3Cpath d=%22M2 13l4-4 3 3 2-2 3 3z%22 fill=%22white%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="viewer/image-viewer.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <form id="path-form" class="path-form">
      <button type="button" id="up" title="Parent folder" aria-label="Parent folder">↑</button>
      <input id="path" type="text" spellcheck="false" autocomplete="off"
             placeholder="Folder or file path, e.g. /home/me/Pictures" aria-label="Folder or file path">
      <button type="submit">Open</button>
    </form>
  </header>
  <main class="layout">
    <aside class="side">
      <input id="filter" type="search" placeholder="Filter…" aria-label="Filter files">
      <div id="status" class="status" role="status"></div>
      <ul id="list" class="list" aria-label="Files"></ul>
    </aside>
    <image-viewer id="viewer"></image-viewer>
  </main>
</body>
</html>
